apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meditriage-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/constanzavaldiviadiaz-svg/meditriage-gitops.git
    targetRevision: main
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: meditriage

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: meditriage-api
      namespace: meditriage
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true