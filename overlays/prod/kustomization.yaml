apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      environment: production
    includeSelectors: false
    includeTemplates: true

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: meditriage-config
    patch: |-
      - op: replace
        path: /data/AMBIENTE
        value: produccion

  - target:
      kind: HorizontalPodAutoscaler
      name: meditriage-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 6