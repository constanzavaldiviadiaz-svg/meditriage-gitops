apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      environment: development
    includeSelectors: false
    includeTemplates: true

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: meditriage-config
    patch: |-
      - op: replace
        path: /data/AMBIENTE
        value: desarrollo

  - target:
      kind: Deployment
      name: meditriage-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

images:
  - name: ghcr.io/constanzavaldiviadiaz-svg/meditriage-api
    digest: sha256:5bb8eb9ada9cda3fcbd9a4e13cba365b1d494ecc574109c8253e2f23b9c89907